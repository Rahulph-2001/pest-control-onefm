# Isolated development stack: Frappe v15 + ERPNext + HR + CRM + OneFM + pest_control.
# Credentials here are for a local throwaway environment only.
name: pest-control-dev

services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "123"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  redis-cache:
    image: redis:8-alpine

  redis-queue:
    image: redis:8-alpine

  frappe:
    image: frappe/bench:latest
    command: sleep infinity
    environment:
      SHELL: /bin/bash
    working_dir: /home/frappe
    volumes:
      - bench:/home/frappe/bench
      - ..:/workspace/pest_control
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  mariadb-data:
  bench:
